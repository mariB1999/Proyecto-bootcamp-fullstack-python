<!DOCTYPE html>
<html>
    <head lang="es">
        <meta charset="UTF-8">
        <title>Suma</title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    </head>
    <body>
        <div class="container">
            <h1 class="h4">Suma</h1>
            
            <div class="mt-4">
                <label class="form-label">Número 1: </label><input class="form-control" type="number" id="numero1" placeholder="Número 1">

                <label class="form-label">Número 2: </label><input class="form-control" type="number" id="numero2" placeholder="Número 2">
            </div>

            <button class="btn btn-primary mt-4" onclick="sumar()">Sumar</button>
        </div>

        <script>
            function sumar() {
                let numero1 = document.getElementById("numero1").value;
                let numero2 = document.getElementById("numero2").value;

                let resultado = Number(numero1) + Number(numero2);

                alert(resultado);

            }
        </script>

        <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>

#Este código es una página web básica que realiza la suma de dos números mediante un formulario simple e interactivo utilizando HTML, estilos visuales con Bootstrap 4 y lógica de cálculo en JavaScript.
