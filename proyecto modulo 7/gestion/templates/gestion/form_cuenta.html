{% extends "base.html" %}

{% block title %}{{ titulo }} | Alke Wallet{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-1">{{ titulo }}</h1>
                <p class="text-muted mb-3">Cliente: {{ cliente.nombre }}</p>

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit">Guardar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
