<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Conversor de Temperatura</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

        <style>
            body {
                background-color: white;
                margin: 0;
            }
        </style>
    </head>
    <body>
        <div class="container bg-light p-3 border shadow">
            <div class="text-dark">
                <h1>Conversor de Temperatura C° a F°</h1>
                <p>En esta página podremos realizar una conversión de grados Celsius a grados Fahrenheit.</p>
            </div>
            
            <div class="input-group mt-3">
                <label class="input-group-text" for="gradosCelsius">Ingrese grados Celsius</label><input type="number" placeholder="Agregue un valor de grados Celsius" id="gradosCelsius" class="form-control">
            </div>

            <div class="d-flex gap-2 mt-3 justify-content-center">
                <button class="btn btn-primary" onclick="convertir();">Convertir</button>
            </div>

            <div class="d-flex gap-2 mt-3 justify-content-center">
                <p>Resultado: <b id="resultado">-</b>° F</p>
            </div>
        </div>

        <script>
            function convertir() {
                let celcius, farenheit;
                celcius = Number(document.getElementById("gradosCelsius").value);
                farenheit = (celcius * 9/5) + 32;

                document.getElementById("resultado").textContent = farenheit;
                //alert(`La temperatura en grados Farenheit es: ${farenheit}`);                
            }
        </script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
