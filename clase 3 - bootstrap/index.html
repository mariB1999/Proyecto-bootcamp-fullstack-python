<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejemplo de Boostrap con formulario</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

        <style>
            body {
                background-color: white;
                margin: 0;
            }
        </style>
    </head>
    <body>
        <div class="container bg-light p-3 border shadow">
            <div class="text-dark">
                <h1>Formulario</h1>
                <p>En esta página podremos realizar sumas de dos números.</p>
            </div>
            
            <div class="input-group mt-3">
                <label class="input-group-text" for="numero1">Número 1: </label><input type="number" placeholder="Agregue un número" id="numero1" class="form-control">
            </div>

            <div class="input-group mt-3">
                <label class="input-group-text" for="numero2">Número 2: </label><input type="number" placeholder="Agregue un número" id="numero2" class="form-control">
            </div>

            <div class="row mt-5">
                <div class="col-3 d-grid">
                    <button class="btn btn-primary" onclick="sumar();">Sumar</button>
                </div>

                <div class="col-3 d-grid">
                    <button class="btn btn-primary" onclick="restar();">Restar</button>
                </div>

                <div class="col-3 d-grid">
                    <button class="btn btn-primary" onclick="multiplicar();">Multiplicar</button>
                </div>

                <div class="col-3 d-grid">
                    <button class="btn btn-primary" onclick="dividir();">Dividir</button>
                </div>
            </div>

        </div>

        <script>
            // Declaración de variables num1 y num2
            // Ambas son variables globales
            let num1, num2;

            function sumar() {
                // Asigno un valor a la variable num1
                num1 = Number(document.getElementById("numero1").value);
                num2 = Number(document.getElementById("numero2").value);

                alert(num1 + num2);
            }

            function restar() {
                num1 = Number(document.getElementById("numero1").value);
                num2 = Number(document.getElementById("numero2").value);
                
                alert(num1 - num2);                
            }

            function multiplicar() {
                num1 = Number(document.getElementById("numero1").value);
                num2 = Number(document.getElementById("numero2").value);
                
                alert(num1 * num2);
            }

            function dividir() {
                num1 = Number(document.getElementById("numero1").value);
                num2 = Number(document.getElementById("numero2").value);
                
                alert(num1 / num2);
            }
        </script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
