<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejemplo de Boostrap con formulario de Sumas, María Contreras</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" i class="bi bi-calculator-fill"></i>

        <style>
            body {
                background-color: green;
                margin: 0;
            }
        </style>
    </head>
    <body>
        <div class="container bg-light p-3 border rounded shadow-lg mt-4">
            <div class="text-center">
                <div class="text-primary">Formulario de Sumas</h1>
                 <p class="text-secondary">
                    En esta página podremos realizar sumas de dos números.
                </p>
            </div>
            
            <div class="input-group mt-3">
                <label class="input-group-text" for="numero1">Número 1: </label><input type="number" placeholder="Agregue un número" id="numero1" class="form-control">
            </div>
            <div class="input-group mt-3">
                <label class="input-group-text" for="numero2">Número 2: </label><input type="number" placeholder="Agregue un número" id="numero2" class="form-control">
            </div>

            <div class="d-grid mt-3">
                <button class="btn btn-primary">Sumar</button>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
