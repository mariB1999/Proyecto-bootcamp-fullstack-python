<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mi sitio web con jQuery</title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    </head>
    <body>
        <div class="container">
            <h1>Suma</h1>
            <div class="mb-3">
                <input id="num1" type="number" placeholder="Ingrese un número" class="form-control">
            </div>
            <div class="mb-3">
                <input id="num2" type="number" placeholder="Ingrese un número" class="form-control">
            </div>
            <div class="mb-3">
                <button id="suma" class="btn btn-primary">Sumar</button>
            </div>
            <div class="mb-3">
                <button id="resta" class="btn btn-primary">Restar</button>
            </div>
            <div class="mb-3">
                <button id="multiplicacion" class="btn btn-primary">Multiplicar</button>
            </div>
            <div class="mb-3">
                <button id="division" class="btn btn-primary">Dividir</button>
            </div>
            <div class="mb-3">
                <p>Resultado: <span id="resultado"></span></p>
            </div>
        </div>

        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

        <script>
            // Línea 40: Se encarga de que en todo momento JQeury esté atento a la ocurrencia de algún evento 
            $(document).ready(function() {
                // Línea 42: Se programa la acción a realizar en caso de que se haga clic en el botón SUMAR
                $("#suma").click(function() {
                    let numero1 = Number($("#num1").val());
                    let numero2 = Number($("#num2").val());

                    let resultado = numero1 + numero2;

                    $("#resultado").text(resultado);
                });

                // Línea 52: Se programa la acción a realizar en caso de que se haga clic en el botón RESTAR
                $("#resta").click(function() {
                    let numero1 = Number($("#num1").val());
                    let numero2 = Number($("#num2").val());

                    let resultado = numero1 - numero2;

                    $("#resultado").text(resultado);
                });

                // Línea 62: Se programa la acción a realizar en caso de que se haga clic en el botón MULTIPLICAR
                $("#multiplicacion").click(function() {
                    let numero1 = Number($("#num1").val());
                    let numero2 = Number($("#num2").val());

                    let resultado = numero1 * numero2;

                    $("#resultado").text(resultado);
                });

                // Línea 72: Se programa la acción a realizar en caso de que se haga clic en el botón DIVIDIR
                $("#division").click(function() {
                    let numero1 = Number($("#num1").val());
                    let numero2 = Number($("#num2").val());

                    let resultado = numero1 / numero2;

                    $("#resultado").text(resultado);
                });
            });

        </script>
    </body>
</html>
