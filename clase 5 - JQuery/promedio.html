<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promedio de Notas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    body {
      background: #ddbbff;  
      padding: 20px;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
    }
    </style>
</head>
<body>
    <div class="container text-center card mt-5 shadow">
        <h1>Calcular Promedio</h1>

        <div class="mb-3">
            <input type="number" id="nota1" class="form-control" placeholder="Ingrese Nota 1">
        </div>
        <div class="mb-3">
            <input type="number" id="nota2" class="form-control" placeholder="Ingrese Nota 2">
        </div>
        <div class="mb-3">
            <input type="number" id="nota3" class="form-control" placeholder="Ingrese Nota 3">
        </div>

        <button id="calcular" class="btn btn-primary">Calcular Promedio</button>
        <p class="mt-3">Promedio:
            <span id="resultado"></span>
        </p>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <script>
        $(document).ready(function () {

            $("#calcular").click(function () {

                let nota1 = Number($("#nota1").val());
                let nota2 = Number($("#nota2").val());
                let nota3 = Number($("#nota3").val());

                if ($("#nota1").val() == "" || $("#nota2").val() == "" || $("#nota3").val() == "") {
                    $("#resultado").text("Debe ingresar las tres notas.");
                } else {

                    let promedio = (nota1 + nota2 + nota3) / 3;
                    $("#resultado").text(promedio.toFixed(2));

                    $("#resultado").animate({
                    fontSize: "32px"
                    }, 500);
                }
            });
        });
    </script>
</body>
</html>
